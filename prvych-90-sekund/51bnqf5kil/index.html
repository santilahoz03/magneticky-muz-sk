<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Prvých 90 Sekúnd — Stiahni bonus</title>
<style>
  :root { --bg:#FBF9F5; --ink:#17130E; --acc:#A63A2A; --muted:#6B5E54; --line:#E2D9CE; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: system-ui,-apple-system,sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 40px 36px; max-width: 480px; width: 100%; text-align: center; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--acc); margin-bottom: 12px; }
  h1 { font-size: 26px; font-weight: 700; line-height: 1.2; margin-bottom: 8px; }
  .sub { font-size: 15px; color: var(--muted); margin-bottom: 32px; line-height: 1.5; }
  .btn { display: inline-block; background: var(--acc); color: #fff; font-size: 15px; font-weight: 700; padding: 16px 32px; border-radius: 10px; text-decoration: none; letter-spacing: 0.02em; margin-bottom: 14px; width: 100%; }
  .btn:hover { opacity: 0.9; }
  .note { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .icon { font-size: 48px; margin-bottom: 16px; }
  .bonus-pill { display: inline-block; background: #A63A2A14; border: 1px solid #A63A2A35; color: var(--acc); font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; padding: 3px 10px; border-radius: 99px; margin-bottom: 12px; }
  @media (max-width: 380px) { .card { padding: 28px 20px; } h1 { font-size: 22px; } }
</style>
</head>
<body>
<div class="card">
  <div class="icon">🎁</div>
  <div class="bonus-pill">Bonus zadarmo</div>
  <div class="label">Bonusová kapitola</div>
  <h1>Prvých 90 Sekúnd: 6 Situácií</h1>
  <p class="sub">Žena, ktorú nepoznáš. Kolegyňa z práce. Na rande. Cez správy. Každá situácia rozpísaná krok za krokom.</p>
  <a class="btn" href="prvych-90-sekund.pdf" download>Stiahnuť bonus →</a>
  <p class="note">Súbor PDF · Otvoríš v každom prehliadači alebo PDF čítačke</p>
</div>
</body>
</html>
